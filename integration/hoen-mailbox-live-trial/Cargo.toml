[package]
name = "hoen-mailbox-live-trial"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
hoen-mailbox-auth = { path = "../../libs/hoen-mailbox-auth" }
hoen-mailbox-history = { path = "../../libs/hoen-mailbox-history" }
reqwest = { version = "=0.11.27", default-features = false, features = ["blocking", "rustls-tls"] }
rustls-pemfile = "=1.0.4"
serde_json = "1"
sha2 = "=0.10.8"
tempfile = "=3.10.1"
zeroize = "=1.8.1"
