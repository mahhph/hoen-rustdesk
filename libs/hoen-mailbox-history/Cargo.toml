[package]
name = "hoen-mailbox-history"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.8.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.10.1"


