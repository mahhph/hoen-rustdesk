<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Desktop</title>
<style>
:root{font-family:system-ui,sans-serif;color:#eef2ff;background:#080d15;color-scheme:dark}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,select,input{font:inherit}button,select{min-height:40px;border:1px solid #475569;border-radius:6px;background:#26344a;color:#eef2ff;padding:.4rem .65rem}button{cursor:pointer}button:hover{background:#354964}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid #8bb8ff;outline-offset:2px}#connect{background:#2866e6}#viewer{position:fixed;inset:0;width:100%;height:100dvh;background:#080d15}#viewer:empty{display:grid;place-items:center}#viewer:empty::before{content:'Choose a computer and connect.';color:#8c9bb2}#toolbar{position:fixed;z-index:20;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 16px);border:1px solid #475569;border-radius:10px;background:#172337f5;box-shadow:0 4px 20px #0007}#toolbar-content{padding:.55rem;max-height:70dvh;overflow:auto}header,.display-row{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem}h1{font-size:.9rem;margin:0 .35rem 0 0}label{display:flex;align-items:center;gap:.35rem;font-size:.85rem}#computer{max-width:180px}#status{display:block;color:#b7c4d8;font-size:.75rem;margin-top:.4rem}#display-controls{margin-top:.45rem;border-top:1px solid #334155;padding-top:.45rem}#display-notice{font-size:.75rem;margin:.3rem 0 0;color:#b7c4d8}#toolbar-toggle{display:block;margin:0 auto;min-height:28px;min-width:64px;padding:0 .6rem;border:0;border-radius:0 0 8px 8px;font-size:12px;background:#26344a}#toolbar.collapsed #toolbar-content{display:none}#toolbar.collapsed{border-radius:0 0 8px 8px;top:0}#toolbar.collapsed #toolbar-toggle{min-height:32px}@media(max-width:600px){#toolbar{width:calc(100vw - 16px)}#toolbar.collapsed{width:auto}h1{display:none}header{gap:.3rem}button,select{min-height:44px}#toolbar-toggle{min-height:32px}}
</style>
</head>
<body>
<main id="viewer" aria-label="Remote desktop"></main>
<aside id="toolbar" aria-label="Remote desktop toolbar">
<div id="toolbar-content">
<header><h1>Remote Desktop</h1><label>Computer <select id="computer" disabled></select></label><button id="connect" disabled>Connect</button><button id="disconnect" disabled>Disconnect</button><button id="keyboard" disabled>Keyboard</button></header>
<section id="display-controls" hidden aria-label="View controls"><div class="display-row"><label>View <select id="scale"><option value="original" selected>Original size</option><option value="fit">Fit to window</option></select></label><button id="fullscreen">Fullscreen</button></div><p id="display-notice" role="status"></p></section>
<span id="status" role="status">Loading computers…</span>
</div>
<button id="toolbar-toggle" aria-label="Hide toolbar" aria-controls="toolbar-content" aria-expanded="true" title="Hide toolbar">⌃ Hide</button>
</aside>
<script type="module" src="/web/main.ts"></script>
</body></html>
