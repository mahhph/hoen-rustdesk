<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Desktop Prototype</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#eef2ff;background:#101827}body{margin:0}header{display:flex;align-items:center;gap:1rem;padding:1rem 1.4rem;background:#1b263a}h1{font-size:1.1rem;margin:0}button{border:0;border-radius:.4rem;padding:.6rem 1rem;font:inherit;cursor:pointer;background:#2866e6;color:white}button:disabled{opacity:.45;cursor:default}#status{color:#b7c4d8;font-size:.9rem}#viewer{height:calc(100vh - 4.5rem);background:#080d15;display:flex;align-items:center;justify-content:center}#viewer:empty::before{content:'Your desktop will appear here after you connect.';color:#8c9bb2}
  body{height:100dvh;display:flex;flex-direction:column}header{flex-wrap:wrap;gap:.5rem;padding:.7rem}#viewer{flex:1;min-height:0;height:auto}#status{flex-basis:100%}button{min-height:44px}@media(max-width:480px){h1{width:100%;font-size:1rem}} #display-controls{background:#1b263a;padding:.5rem .7rem;border-top:1px solid #334155}.display-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:end}.display-row label{display:flex;flex-direction:column;gap:.2rem;font-size:.8rem}select{font:inherit;color:#eef2ff;background:#101827;border:1px solid #526078;border-radius:6px;padding:.6rem;min-height:44px;max-width:100%}#display-notice{font-size:.75rem;color:#b7c4d8;margin:.4rem 0 0} dialog{background:#1b263a;color:#eef2ff;border:1px solid #526078;border-radius:10px;width:min(760px,90vw);max-height:85vh}dialog::backdrop{background:#0009}#file-list{max-height:45vh;overflow:auto}.file-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-bottom:1px solid #334155;padding:.3rem}.file-row span{overflow-wrap:anywhere}dialog input{font:inherit;max-width:100%;margin:.5rem} </style>
</head>
<body>
  <header><h1>Remote Desktop</h1><label>Computer <select id="computer" disabled></select></label><button id="files" disabled>Files</button><button id="connect" disabled>Connect</button><button id="disconnect" disabled>Disconnect</button><button id="keyboard" disabled>Keyboard</button><span id="status" role="status">Checking connection…</span></header>
  <section id="display-controls" hidden aria-label="Display controls"><div class="display-row"><label>Monitor <select id="monitor"></select></label><label>Resolution <select id="resolution"></select></label><button id="apply-resolution" disabled>Apply</button><label>View <select id="scale"><option value="fit">Fit to window</option><option value="original">Original size</option></select></label><button id="fullscreen">Fullscreen</button></div><p id="display-notice" role="status"></p></section><main id="viewer" aria-label="Remote desktop"></main>
  <script type="module" src="/web/main.ts"></script>
</body>
</html>
