[package]
name = "hoen-mailbox-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
base64 = "=0.21.7"
reqwest = { version = "=0.11.27", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.36", features = ["parsing"] }
url = "=2.5.2"
zeroize = "=1.8.1"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
sha2 = "=0.10.8"
rustls = { version = "=0.21.12", features = ["dangerous_configuration"] }
rustls-pemfile = "=1.0.4"

[dev-dependencies]
rcgen = "=0.12.1"
